name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ankiaddon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build .ankiaddon
        id: build
        run: echo "file=$(python package.py --version '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' '${{ steps.build.outputs.file }}' --title '${{ github.ref_name }}' --generate-notes
